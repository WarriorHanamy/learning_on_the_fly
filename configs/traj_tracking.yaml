# Trajectory Tracking Training Configuration
# Extracted from examples/traj_tracking/1_train_base_policy.ipynb

# Random seed for reproducibility
seed: 0

# Training parameters
num_envs: 300
max_epochs: 300
window_size: 0

# Simulation parameters
sim_dt: 0.02
max_sim_time: 12.0        # align to fig8 duration (1 full lap)
delay: 0.04

# Reference trajectory
ref_traj_name: fig8
skip_start: true

# Figure-8 trajectory generator parameters (optional, defaults shown)
fig8_config:
  a: 4.0          # Lemniscate amplitude [m]
  height: 1.0     # Constant flight height [m]
  duration: 12.0  # Total trajectory duration [s]
  num_points: 600 # Number of waypoints

# Forward model config (legacy — prefer 'scheme' field)
forward_model_config:
  enable_inner_loop_dynamics: false
  enable_residual_acceleration: false
  enable_inner_loop_approx: false

# Scheme-based simulation selection (new approach)
# Allowed values: simplest, resacc, approx, approx_resacc, inner_loop, full
scheme: simplest
# scheme_config:  # optional scheme-specific overrides
#   chirp_path: ""
#   dt_low_level: 0.001
#   rotor_augmentation_path: null
#   kp: [40.0, 40.0, 30.0]
#   kd: [20.0, 20.0, 0.0]

# Environment noise parameters
yaw_scale: 0.1
pitch_roll_scale: 0.1
position_std: 0.1
velocity_std: 0.1
omega_std: 0.1

# Policy network architecture
policy_net:
  hidden_layers:
    - 512
    - 512
  initial_scale: 0.01

# Optimizer settings
optimizer:
  initial_lr: 0.001
  scheduler: cosine_decay
