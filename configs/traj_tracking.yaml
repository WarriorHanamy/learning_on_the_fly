# Trajectory Tracking Training Configuration
# Extracted from examples/traj_tracking/1_train_base_policy.ipynb

# Random seed for reproducibility
seed: 0

# Training parameters
num_envs: 300
max_epochs: 300

# Simulation parameters
sim_dt: 0.02
max_sim_time: 5.0
delay: 0.04

# Reference trajectory
ref_traj_name: fig8
skip_start: true

# Simulation dynamics config
sim_dyn_config:
  use_high_fidelity: false
  use_forward_residual: false

# Environment noise parameters
yaw_scale: 0.1
pitch_roll_scale: 0.1
position_std: 0.1
velocity_std: 0.1
omega_std: 0.1

# Policy network architecture
policy_net:
  hidden_layers:
    - 512
    - 512
  initial_scale: 0.01

# Optimizer settings
optimizer:
  initial_lr: 0.001
  scheduler: cosine_decay
