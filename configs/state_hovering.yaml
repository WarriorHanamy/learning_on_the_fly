# State-Based Hovering Training Configuration
# Extracted from examples/state_hovering/1_train_base_policy.ipynb

# Random seed for reproducibility
seed: 0

# Training parameters
num_envs: 200
max_epochs: 200

# Simulation parameters
sim_dt: 0.02
max_sim_time: 3.0
delay: 0.04

# Reward parameters
reward_sharpness: 3.0
action_penalty_weight: 0.5

# Hover target position [x, y, z]
hover_target:
  - 1.5
  - 0.0
  - 1.5

# Simulation dynamics config
sim_dyn_config:
  use_high_fidelity: false
  use_forward_residual: false

# Environment noise parameters
yaw_scale: 1.0
pitch_roll_scale: 0.1
velocity_std: 0.1
omega_std: 0.1
margin: 0.5

# Policy network architecture
policy_net:
  hidden_layers:
    - 512
    - 512
  initial_scale: 0.01

# Optimizer settings
optimizer:
  initial_lr: 0.005
  scheduler: cosine_decay
